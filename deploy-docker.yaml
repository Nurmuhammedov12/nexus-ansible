---
- name: Install Docker and deploy a container
  hosts: docker_hosts
  become: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes

# - name: Install Docker Compose
#   hosts: docker_hosts
#   tasks:
#     - name: Create docker-compose directory
#       file:
#         path: ~/.docker/cli-plugins
#         state: directory
#     - name: Download Docker Compose
#       get_url:
#         url: curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 o /usr/local/lib/docker/cli-plugins/docker-compose
#         dest: /usr/local/lib/docker/cli-plugins/docker-compose
#         mode: '0755'

    - name: Install cli tools for Docker
      apt:
        name: docker-compose
        state: present


    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes
    - name: add to docker group
      user:
        name: root
        groups: docker
        append: yes

    - name: Ensure Docker is running
      command: docker info
      register: docker_info
      failed_when: docker_info.rc != 0
      
    - name: Reconnect to the host after adding to docker group
      meta: reset_connection

    - name: Pull the latest nginx image
      docker_image:
        name: nginx
        source: pull

    - name: Run nginx container
      docker_container:
        name: my_nginx
        image: nginx
        state: started
        ports:
          - "80:80"